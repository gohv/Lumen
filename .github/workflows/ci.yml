name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (WoW's Lua version)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: for f in *.lua; do luac5.1 -p "$f"; done
      - name: Mock-API harness
        run: lua5.1 tests/harness.lua .
      - name: Mock-API harness (all combat values secret)
        run: SECRET=1 lua5.1 tests/harness.lua .
